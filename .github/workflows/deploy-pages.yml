name: Deploy PhyloPrep Browser Edition

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate browser JavaScript
        run: |
          node --check site/app.js
          node --check site/pyodide-worker.js
          node --check site/browser-disk-fs.js
          node --check site/browser-hash.js
          node --check site/browser-reuse.js
          node --check site/alignment-worker.js
      - name: Validate Python syntax
        run: python -m py_compile phyloprep.py MSAP.py MSAP_batch.py alignment_qc.py sequence_audit.py site/browser_runner.py
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mafft
          python -m pip install --upgrade pytest biopython
      - name: Run Python test suite
        run: python -m pytest -q
      - name: Compile 4 GiB MAFFT and MUSCLE WebAssembly builds
        run: |
          docker run --rm -e HOME=/tmp -v "$PWD:/src" -w /src emscripten/emsdk:2.0.25 python3 scripts/build_browser_aligners.py
          node site/aligner-build-test.mjs
      - name: Bundle original browser scripts
        run: node site/build-engine.mjs
      - name: Run browser bundle smoke checks
        run: node site/smoke-test.mjs
      - name: Test memory growth and real browser alignments
        run: |
          npm install --prefix "$RUNNER_TEMP/aligner-tests" playwright@1.56.1
          "$RUNNER_TEMP/aligner-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/aligner-tests/node_modules" node site/aligner-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/aligner-tests/node_modules" node site/disk-browser-test.cjs
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
