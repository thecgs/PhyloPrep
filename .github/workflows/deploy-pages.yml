name: Deploy PhyloPrep Browser Edition

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate browser JavaScript
        run: |
          node --check site/app.js
          node --check site/pyodide-worker.js
          node --check site/alignment-worker.js
      - name: Validate browser Python adapters
        run: python -m py_compile site/browser_runner.py
      - name: Run browser bundle smoke checks
        run: node site/smoke-test.mjs
      - name: Bundle original browser scripts
        run: node site/build-engine.mjs
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
